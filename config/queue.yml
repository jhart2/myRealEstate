default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Hosting-only gallery ingest (download → Active Storage). Enhance runs separately.
    - queues: "gallery_ingest"
      threads: <%= Integer(ENV.fetch("GALLERY_INGEST_THREADS", 2)) %>
      processes: 1
      polling_interval: 1
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
