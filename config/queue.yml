default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # FIFO listing gallery ingest+enhance (download → polish → ESRGAN → attach).
    # One thread so jobs drain in enqueue order; ESRGAN flock serializes GPU use.
    - queues: "gallery_enhance"
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
