test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Staging GCS (tt-realty-staging). Cloud Run uses ADC via its runtime SA —
# do not check in a keyfile. Set GCS_BUCKET (+ optional GCS_PROJECT).
google:
  service: GCS
  project: <%= ENV.fetch("GCS_PROJECT") { ENV.fetch("GOOGLE_CLOUD_PROJECT", "tt-realty-staging") } %>
  bucket: <%= ENV.fetch("GCS_BUCKET", "tt-realty-staging-activestorage") %>
  # credentials: omitted → Application Default Credentials (Cloud Run / gcloud auth)
