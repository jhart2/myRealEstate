<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bad request · TT Realty</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="application-name" content="TT Realty">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #141414;
      --ground: #f5f3ef;
      --trinidad: hsl(353 85% 44%);
      --trinidad-dark: hsl(353 85% 38%);
      --font-display: "Fraunces", Georgia, serif;
      --font-sans: "DM Sans", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; font-family: var(--font-sans); color: var(--ground); background: var(--ink); }
    .page { position: relative; display: flex; flex-direction: column; min-height: 100dvh; overflow: hidden; }
    .atmosphere {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 15% 20%, hsl(353 85% 44% / 0.18), transparent 55%),
        radial-gradient(ellipse 60% 50% at 90% 75%, hsl(40 40% 55% / 0.12), transparent 50%),
        linear-gradient(165deg, #100c08 0%, #010203 55%, #080808 100%);
    }
    .inner { position: relative; z-index: 1; width: 100%; max-width: 64rem; margin: 0 auto; padding: 0 1.5rem; }
    header.inner { display: flex; align-items: center; justify-content: space-between; padding-top: 2rem; }
    .brand { display: inline-flex; align-items: center; gap: 0.625rem; text-decoration: none; color: inherit; }
    .brand-mark { font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 600; letter-spacing: -0.02em; color: var(--ground); }
    .brand-word { margin-top: 0.2rem; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--trinidad); }
    .code { font-family: var(--font-display); font-weight: 300; font-size: 0.875rem; letter-spacing: 0.2em; color: color-mix(in srgb, var(--ground) 35%, transparent); }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 5rem 0; }
    .eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--trinidad); }
    h1 { margin-top: 1.25rem; max-width: 48rem; font-family: var(--font-display); font-weight: 300; font-size: clamp(2.25rem, 6vw, 4.25rem); line-height: 1.1; color: var(--ground); }
    .body { margin-top: 1.5rem; max-width: 28rem; font-size: 1.0625rem; line-height: 1.6; color: color-mix(in srgb, var(--ground) 55%, transparent); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; text-decoration: none; transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
    .btn-accent { background: var(--trinidad); color: #fff; }
    .btn-accent:hover { background: var(--trinidad-dark); }
    .btn-ghost { border: 1px solid color-mix(in srgb, var(--ground) 25%, transparent); color: color-mix(in srgb, var(--ground) 80%, transparent); font-weight: 500; }
    .btn-ghost:hover { border-color: color-mix(in srgb, var(--ground) 50%, transparent); color: var(--ground); }
    footer.inner { padding-bottom: 2.5rem; }
    footer p { font-size: 0.75rem; letter-spacing: 0.02em; color: color-mix(in srgb, var(--ground) 30%, transparent); }
    @keyframes rise { from { opacity: 0; transform: translateY(0.85rem); } to { opacity: 1; transform: translateY(0); } }
    .brand, .code, .eyebrow, h1, .body, .actions { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .code { animation-delay: 0.06s; } .eyebrow { animation-delay: 0.14s; } h1 { animation-delay: 0.22s; } .body { animation-delay: 0.32s; } .actions { animation-delay: 0.42s; }
    @media (prefers-reduced-motion: reduce) { .brand, .code, .eyebrow, h1, .body, .actions { animation: none; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="inner">
      <a class="brand" href="/"><span class="brand-mark">TT</span><span class="brand-word">Realty</span></a>
      <p class="code">400</p>
    </header>
    <div class="inner content">
      <p class="eyebrow">Bad request</p>
      <h1>That request couldn’t be read.</h1>
      <p class="body">Something in the request was incomplete or invalid. Try again from the homepage.</p>
      <div class="actions">
        <a class="btn btn-accent" href="/properties?intent=sale">Browse homes</a>
        <a class="btn btn-ghost" href="/">Back home</a>
      </div>
    </div>
    <footer class="inner"><p>© TT Realty</p></footer>
  </div>
</body>
</html>
